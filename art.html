  <script>
    (function () {
      var viewer = document.getElementById("viewer");
      var viewerImg = document.getElementById("viewer-img");
      var viewerTitle = document.getElementById("viewer-title");
      document.querySelectorAll(".art-tile").forEach(function (tile) {
        tile.addEventListener("click", function () {
          var img = tile.querySelector("img");
          viewerImg.src = tile.getAttribute("data-full");
          viewerImg.alt = img.alt;
          viewerTitle.textContent = tile.querySelector("span").textContent;
          viewer.showModal();
        });
      });
      document.getElementById("viewer-close").addEventListener("click", function () {
        viewer.close();
      });
    })();
